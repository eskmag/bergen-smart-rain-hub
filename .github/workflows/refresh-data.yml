name: Refresh rain data

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh endpoint
        run: |
          status=$(curl -s -o /tmp/refresh_response.json -w "%{http_code}" \
            -X POST "${{ vars.APP_URL }}/api/admin/refresh" \
            -H "X-Refresh-Token: ${{ secrets.REFRESH_TOKEN }}")
          cat /tmp/refresh_response.json
          if [ "$status" -ge 300 ]; then
            echo "Refresh failed with HTTP $status"
            exit 1
          fi
